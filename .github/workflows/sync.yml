name: Sync upstream skills
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency:
  group: sync-upstream
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  SYNC_BRANCH: sync/upstream
jobs:
  sync:
    name: Sync
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # for checkout; the App token below pushes and opens the PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild from the current upstream branches
        run: >-
          python3 scripts/skills.py update
          --summary "${RUNNER_TEMP}/summary.md"
          --auto-merge-flag "${RUNNER_TEMP}/auto-merge"
      - name: Validate the rebuilt mirror
        run: python3 scripts/skills.py check
      # The org does not let GITHUB_TOKEN open pull requests, so a GitHub App
      # token does. It is limited to this repository's contents and pull
      # requests, and, unlike GITHUB_TOKEN, its pull requests start CI.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or refresh the sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          pr="$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Upstream unchanged."
            if [[ -n "${pr}" ]]; then
              gh pr close "${pr}" --delete-branch --comment "main already matches upstream."
            fi
            exit 0
          fi
          {
            echo "Automated sync of the mirrored upstream skills."
            echo
            cat "${RUNNER_TEMP}/summary.md"
          } > "${RUNNER_TEMP}/body.md"
          gh auth setup-git
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch --create "${SYNC_BRANCH}"
          git add --all
          git commit --quiet --message "chore: sync upstream skills"
          auto_merge="$(cat "${RUNNER_TEMP}/auto-merge")"
          if [[ -n "${pr}" && "${auto_merge}" != "true" ]]; then
            # Turn auto-merge off before new commits can satisfy the checks.
            gh pr merge "${pr}" --disable-auto || true
          fi
          git push --force origin "${SYNC_BRANCH}"
          if [[ -n "${pr}" ]]; then
            gh pr edit "${pr}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --head "${SYNC_BRANCH}" --base main \
              --title "chore: sync upstream skills" --body-file "${RUNNER_TEMP}/body.md"
          fi
          # Only Markdown and license changes merge without review. Scripts
          # and other files wait for a person.
          if [[ "${auto_merge}" == "true" ]]; then
            gh pr merge "${SYNC_BRANCH}" --auto --squash
          fi
